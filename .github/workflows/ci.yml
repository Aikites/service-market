name: Factory CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-factory:
    name: verify-factory (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 = package.json engines 基线；24 = 本机实际版本，避免「本地绿、CI 红」
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # 刻意不写 cache: 'npm' —— setup-node 会在没有 lockfile 时直接报
          # "Dependencies lock file is not found"，而本仓库 .gitignore 忽略了 package-lock.json

      - name: 环境信息
        run: |
          node -v
          npm -v

      # 工厂校验只用到 Node 内置模块（fs / path / child_process），零依赖。
      # 所以这里不无条件跑 npm ci：
      #   - 无 package-lock.json 时 npm ci 会失败（npm ci 只能配合 lockfile 使用）；
      #   - 将来接入 vitest / tsc / eslint 时，请先提交 lockfile，再走 npm ci 分支；
      #   - --ignore-scripts 用来避免 postinstall 在 Node 24 上触发 prisma 等原生依赖编译。
      - name: 依赖安装（有 lockfile 才装，当前零依赖会跳过）
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund --ignore-scripts
          else
            echo "无 package-lock.json：工厂校验零依赖，跳过 npm ci"
          fi

      - name: 工厂完整性测试（8 阶段）
        run: npm run test:integrity

      - name: 上传 integrity-report.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-report-node${{ matrix.node }}
          path: scope/integrity-report.json
          if-no-files-found: warn
          retention-days: 30

